name: Auto-Update Rosalind Repo

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'assets/**'
  schedule:
    - cron: '0 0 * * *' # Автозапуск каждый день в 00:00 UTC
  workflow_dispatch:     # Добавляет кнопку "Run workflow" для ручного запуска из интерфейса GitHub

jobs:
  update-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib

      - name: Update README Table
        run: python update_readme.py

      - name: Generate Stats & Progress Graph
        run: python generate_stats.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update README and progress stats [skip ci]"
          file_pattern: "README.md assets/progress_timeline.png assets/history.json"
